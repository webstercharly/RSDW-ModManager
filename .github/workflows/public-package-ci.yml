name: Public package CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install lupa pillow jsonschema
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
      - name: Validate public package
        shell: pwsh
        run: ./Tools/Test-PublicPackage.ps1
